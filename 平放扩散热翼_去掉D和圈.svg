<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="900" viewBox="0 0 1000 900" role="img">
<defs>
  <linearGradient id="cellGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#2980B9"/><stop offset="100%" stop-color="#3498DB"/>
  </linearGradient>
  <linearGradient id="wingGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#95BBD6"/><stop offset="50%" stop-color="#F1C40F"/><stop offset="100%" stop-color="#95BBD6"/>
  </linearGradient>
  <marker id="arrowSun" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
    <path d="M0,0 L10,5 L0,10 Z" fill="#F39C12"/>
  </marker>
  <marker id="arrowCool" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
    <path d="M0,0 L9,4.5 L0,9 Z" fill="#16A085"/>
  </marker>
  <marker id="arrowHot" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
    <path d="M0,0 L9,4.5 L0,9 Z" fill="#D35400"/>
  </marker>
</defs>
<rect width="1000" height="900" fill="white"/>
<text x="48" y="48" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="30" font-weight="bold" fill="#2C3E50" text-anchor="start">平放扩热翼散热</text>
<text x="952" y="46" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="15" font-weight="400" fill="#7F8C8D" text-anchor="end">结构候选示意，非性能排序</text>
<line x1="48" y1="72" x2="952" y2="72" stroke="#95A5A6" stroke-width="2" stroke-linecap="round"/>
<rect x="48" y="100" width="904" height="438" rx="14" fill="#E8F6F3" fill-opacity="0.55" stroke="#95A5A6" stroke-width="2"/>
<text x="120" y="144" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="22" font-weight="bold" fill="#2C3E50" text-anchor="start">平放扩热翼</text>
<rect x="160" y="285" width="680" height="92" rx="5" fill="url(#wingGrad)" stroke="none"/>
<rect x="380" y="285" width="240" height="92" fill="#EDBB99" stroke="none"/>
<rect x="160" y="285" width="680" height="92" rx="5" fill="none" stroke="#2C3E50" stroke-width="3"/>
<line x1="380" y1="285" x2="380" y2="377" stroke="#D35400" stroke-width="2"/>
<line x1="620" y1="285" x2="620" y2="377" stroke="#D35400" stroke-width="2"/>
<text x="500" y="340" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="18" font-weight="bold" fill="#2C3E50" text-anchor="middle">中央 4×2 mm 受光区</text>
<line x1="375" y1="331" x2="230" y2="331" stroke="#D35400" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowHot)"/>
<line x1="625" y1="331" x2="770" y2="331" stroke="#D35400" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowHot)"/>
<line x1="270" y1="395" x2="270" y2="425" stroke="#16A085" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowCool)"/>
<line x1="730" y1="395" x2="730" y2="425" stroke="#16A085" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowCool)"/>
<text x="70" y="575" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="20" font-weight="bold" fill="#2C3E50" text-anchor="start">图例</text>
<line x1="100" y1="610" x2="150" y2="610" stroke="#D35400" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowHot)"/>
<text x="175" y="616" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="16" font-weight="400" fill="#D35400" text-anchor="start">深橙水平箭头：硅内横向扩热</text>
<rect x="80" y="650" width="42" height="16" fill="#EDBB99" stroke="#D35400" stroke-width="1.5"/>
<text x="135" y="665" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="16" font-weight="400" fill="#2C3E50" text-anchor="start">橙色矩形：中央4×2 mm受光区</text>
<rect x="500" y="650" width="42" height="16" fill="url(#wingGrad)" stroke="#2C3E50" stroke-width="1.5"/>
<text x="555" y="665" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="16" font-weight="400" fill="#2C3E50" text-anchor="start">渐变侧块：左右2 mm扩热翼</text>
<line x1="100" y1="700" x2="100" y2="730" stroke="#16A085" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowCool)"/>
<text x="125" y="730" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="16" font-weight="400" fill="#16A085" text-anchor="start">绿色小竖箭头：垂直于扩热翼的冷却流向</text>
<text x="500" y="755" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="16" font-weight="400" fill="#7F8C8D" text-anchor="middle">尺寸基线：4×2×0.3 mm（候选）</text>
<text x="70" y="795" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="15" font-weight="400" fill="#7F8C8D" text-anchor="start">扩热翼仅位于中央受光区两侧，不侵入受光区；冷却箭头表示垂直换热方向。</text>
<line x1="48" y1="825" x2="952" y2="825" stroke="#95A5A6" stroke-width="1" stroke-linecap="round"/>
<text x="500" y="860" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="15" font-weight="400" fill="#7F8C8D" text-anchor="middle">概念结构示意；流场与性能需进一步验证。</text>
</svg>
