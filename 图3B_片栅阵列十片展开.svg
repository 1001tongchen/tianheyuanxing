<?xml version="1.0" encoding="UTF-8"?>
<svg width="1600" height="620" viewBox="0 0 1600 620" xmlns="http://www.w3.org/2000/svg" font-family="'Microsoft YaHei','SimHei','Arial',sans-serif">
  <defs>
    <linearGradient id="cellGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2980B9"/><stop offset="100%" stop-color="#3498DB"/></linearGradient>
    <linearGradient id="beamGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FFD700" stop-opacity="0.14"/><stop offset="60%" stop-color="#F39C12" stop-opacity="0.34"/><stop offset="100%" stop-color="#F1C40F" stop-opacity="0.05"/></linearGradient>
    <marker id="arrowAxis" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#2C3E50"/></marker>
  </defs>
  <rect width="1600" height="620" fill="white"/>
  <text x="30" y="30" font-size="20" font-weight="bold" fill="#333">图3B</text>
  <text x="100" y="30" font-size="16" font-weight="bold" fill="#333">片栅阵列十片展开：避免把十片压成一条重叠线</text>
  <rect x="30" y="60" width="1540" height="460" rx="10" fill="#FBFCFC" stroke="#ECF0F1" stroke-width="1.5"/>

  <text x="80" y="90" font-size="11" fill="#F39C12" font-weight="bold">入射光方向</text>
  <g fill="url(#beamGrad)" opacity="0.85">
    <rect x="50" y="96" width="140" height="84"/><rect x="190" y="96" width="140" height="117"/><rect x="330" y="96" width="140" height="150"/><rect x="470" y="96" width="140" height="183"/><rect x="610" y="96" width="140" height="216"/>
    <rect x="750" y="96" width="140" height="249"/><rect x="890" y="96" width="140" height="282"/><rect x="1030" y="96" width="140" height="315"/><rect x="1170" y="96" width="140" height="348"/><rect x="1310" y="96" width="140" height="381"/>
  </g>
  <g stroke="#F39C12" stroke-width="1.1" stroke-dasharray="5,3" opacity="0.8">
    <line x1="85" y1="96" x2="85" y2="180"/><line x1="155" y1="96" x2="155" y2="180"/><line x1="225" y1="96" x2="225" y2="213"/><line x1="295" y1="96" x2="295" y2="213"/><line x1="365" y1="96" x2="365" y2="246"/><line x1="435" y1="96" x2="435" y2="246"/><line x1="505" y1="96" x2="505" y2="279"/><line x1="575" y1="96" x2="575" y2="279"/><line x1="645" y1="96" x2="645" y2="312"/><line x1="715" y1="96" x2="715" y2="312"/><line x1="785" y1="96" x2="785" y2="345"/><line x1="855" y1="96" x2="855" y2="345"/><line x1="925" y1="96" x2="925" y2="378"/><line x1="995" y1="96" x2="995" y2="378"/><line x1="1065" y1="96" x2="1065" y2="411"/><line x1="1135" y1="96" x2="1135" y2="411"/><line x1="1205" y1="96" x2="1205" y2="444"/><line x1="1275" y1="96" x2="1275" y2="444"/><line x1="1345" y1="96" x2="1345" y2="477"/><line x1="1415" y1="96" x2="1415" y2="477"/>
  </g>
  <g fill="url(#cellGrad)" stroke="#2C3E50" stroke-width="1.1">
    <rect x="50" y="180" width="140" height="16" rx="2"/><rect x="190" y="213" width="140" height="16" rx="2"/><rect x="330" y="246" width="140" height="16" rx="2"/><rect x="470" y="279" width="140" height="16" rx="2"/><rect x="610" y="312" width="140" height="16" rx="2"/><rect x="750" y="345" width="140" height="16" rx="2"/><rect x="890" y="378" width="140" height="16" rx="2"/><rect x="1030" y="411" width="140" height="16" rx="2"/><rect x="1170" y="444" width="140" height="16" rx="2"/><rect x="1310" y="477" width="140" height="16" rx="2"/>
  </g>
  <g fill="#2C3E50" font-size="10" font-weight="bold" text-anchor="middle">
    <text x="120" y="170">L1 · z=−1</text><text x="260" y="203">L2 · z=−2</text><text x="400" y="236">L3 · z=−3</text><text x="540" y="269">L4 · z=−4</text><text x="680" y="302">L5 · z=−5</text><text x="820" y="335">L6 · z=−6</text><text x="960" y="368">L7 · z=−7</text><text x="1100" y="401">L8 · z=−8</text><text x="1240" y="434">L9 · z=−9</text><text x="1380" y="467">L10 · z=−10</text>
  </g>

  <!-- independent axes and a clean 4 mm dimension -->
  <line x1="35" y1="500" x2="35" y2="118" stroke="#2C3E50" stroke-width="1.2" marker-end="url(#arrowAxis)"/>
  <text x="15" y="310" text-anchor="middle" transform="rotate(-90 15 310)" font-size="11" fill="#2C3E50">Z（光↓）</text>
  <line x1="80" y1="500" x2="1515" y2="500" stroke="#2C3E50" stroke-width="1.2" marker-end="url(#arrowAxis)"/>
  <text x="1518" y="516" font-size="11" fill="#2C3E50">X</text>
  <g stroke="#7F8C8D" stroke-width="0.8"><line x1="610" y1="390" x2="610" y2="478"/><line x1="750" y1="390" x2="750" y2="478"/><line x1="610" y1="476" x2="750" y2="476"/></g>
  <text x="680" y="493" text-anchor="middle" font-size="10" fill="#7F8C8D">4 mm（单片长度示意）</text>
  <rect x="30" y="540" width="1540" height="60" rx="8" fill="#E8F6F3" stroke="#A2D9CE"/>
  <text x="50" y="560" font-size="11" fill="#2C3E50" font-weight="bold">十片展开的用途：</text>
  <text x="180" y="560" font-size="11" fill="#34495E">检查片间位置、编号和法向间隙，避免把十片压在一条线上。</text>
  <text x="180" y="580" font-size="10" fill="#7F8C8D">这是4×2×0.3 mm独立小片阵列几何示意；z值仅作层序标记，不等同 N100，不给出串并联、电流或散热结果。</text>
</svg>
