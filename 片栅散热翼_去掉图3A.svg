<?xml version="1.0" encoding="UTF-8"?>
<svg width="980" height="600" viewBox="0 0 980 600" xmlns="http://www.w3.org/2000/svg" font-family="'Microsoft YaHei','SimHei','Arial',sans-serif">
  <defs>
    <linearGradient id="cellGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2980B9"/><stop offset="100%" stop-color="#3498DB"/></linearGradient>
    <linearGradient id="sideEndpointGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#97BBD2"/><stop offset="100%" stop-color="#9ABBC9"/></linearGradient>
    <linearGradient id="legendChipGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#95BBD6"/><stop offset="50%" stop-color="#F1C40F"/><stop offset="100%" stop-color="#95BBD6"/></linearGradient>
    <linearGradient id="beamGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FFD700" stop-opacity="0.16"/><stop offset="60%" stop-color="#F39C12" stop-opacity="0.38"/><stop offset="100%" stop-color="#F1C40F" stop-opacity="0.08"/></linearGradient>
    <marker id="arrowAxis" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#2C3E50"/></marker>
    <marker id="arrowTeal" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#16A085"/></marker>
  </defs>
  <rect width="980" height="600" fill="white"/>
  <text x="30" y="30" font-size="16" font-weight="bold" fill="#333">片栅阵列基础几何：5片阶梯排列</text>
  <rect x="30" y="60" width="920" height="360" rx="10" fill="#FBFCFC" stroke="#ECF0F1" stroke-width="1.5"/>

  <!-- solar projection, one clean beam per chip -->
  <g fill="url(#beamGrad)" opacity="0.85">
    <rect x="60" y="78" width="160" height="100"/><rect x="220" y="78" width="160" height="136"/>
    <rect x="380" y="78" width="160" height="172"/><rect x="540" y="78" width="160" height="208"/>
    <rect x="700" y="78" width="160" height="244"/>
  </g>
  <g stroke="#F39C12" stroke-width="1.2" stroke-dasharray="5,3" opacity="0.8">
    <line x1="100" y1="78" x2="100" y2="178"/><line x1="180" y1="78" x2="180" y2="178"/>
    <line x1="260" y1="78" x2="260" y2="214"/><line x1="340" y1="78" x2="340" y2="214"/>
    <line x1="420" y1="78" x2="420" y2="250"/><line x1="500" y1="78" x2="500" y2="250"/>
    <line x1="580" y1="78" x2="580" y2="286"/><line x1="660" y1="78" x2="660" y2="286"/>
    <line x1="740" y1="78" x2="740" y2="322"/><line x1="820" y1="78" x2="820" y2="322"/>
  </g>
  <text x="465" y="84" text-anchor="middle" font-size="11" font-weight="bold" fill="#F39C12">入射光方向</text>

  <!-- clean staggered chip bars -->
  <g fill="url(#sideEndpointGrad)" stroke="#2C3E50" stroke-width="1.2">
    <rect x="60" y="178" width="160" height="16" rx="2"/><rect x="220" y="214" width="160" height="16" rx="2"/>
    <rect x="380" y="250" width="160" height="16" rx="2"/><rect x="540" y="286" width="160" height="16" rx="2"/>
    <rect x="700" y="322" width="160" height="16" rx="2"/>
  </g>
  <g fill="#2C3E50" font-size="11" font-weight="bold" text-anchor="middle">
    <text x="140" y="168">L1 · z = −1</text><text x="300" y="204">L2 · z = −2</text><text x="460" y="240">L3 · z = −3</text><text x="620" y="276">L4 · z = −4</text><text x="780" y="312">L5 · z = −5</text>
  </g>

  <!-- axes and dimensions kept separate from the array -->
  <line x1="40" y1="370" x2="40" y2="100" stroke="#2C3E50" stroke-width="1.3" marker-end="url(#arrowAxis)"/>
  <text x="20" y="245" text-anchor="middle" transform="rotate(-90 20 245)" font-size="11" fill="#2C3E50">Z（光↓）</text>
  <line x1="90" y1="370" x2="850" y2="370" stroke="#2C3E50" stroke-width="1.3" marker-end="url(#arrowAxis)"/>
  <text x="860" y="386" font-size="11" fill="#2C3E50">X</text>
  <g stroke="#7F8C8D" stroke-width="0.8"><line x1="380" y1="280" x2="380" y2="350"/><line x1="540" y1="280" x2="540" y2="350"/><line x1="380" y1="348" x2="540" y2="348"/></g>
  <text x="460" y="364" text-anchor="middle" font-size="10" fill="#7F8C8D">2 mm（示意尺寸）</text>
  <path d="M550 250 L550 266" stroke="#7F8C8D" stroke-width="0.8"/><path d="M545 250 L555 250 M545 266 L555 266" stroke="#7F8C8D" stroke-width="0.8"/>
  <text x="560" y="261" font-size="10" fill="#7F8C8D">0.3 mm</text>

  <!-- separate parameter card -->
  <rect x="30" y="440" width="920" height="120" rx="10" fill="#E8F6F3" stroke="#A2D9CE"/>
  <text x="50" y="470" font-size="12" font-weight="bold" fill="#2C3E50">本图只定义几何关系</text>
  <text x="50" y="490" font-size="11" fill="#34495E">• 5片沿 X 方向错落展开，光束与每片一一对应；</text>
  <text x="50" y="510" font-size="11" fill="#34495E">• 片间法向间隙、流道宽度和支撑方式需要另行冻结；</text>
  <text x="50" y="530" font-size="11" fill="#7F8C8D">• 4×2×0.3 mm 是独立小片基线；z值仅作层序示意，不等同 N100，也不表示已经得到散热结果。</text>
  <g transform="translate(742,448)">
    <text x="75" y="11" text-anchor="middle" font-size="10" font-weight="bold" fill="#2C3E50">独立小片俯视示意</text>
    <rect x="0" y="20" width="150" height="18" rx="3" fill="url(#legendChipGrad)" stroke="#2C3E50"/>
    <line x1="37.5" y1="20" x2="37.5" y2="38" stroke="#FFFFFF" stroke-width="1.5"/>
    <line x1="112.5" y1="20" x2="112.5" y2="38" stroke="#FFFFFF" stroke-width="1.5"/>
    <line x1="158" y1="20" x2="158" y2="38" stroke="#7F8C8D" stroke-width="0.8"/>
    <line x1="154" y1="20" x2="162" y2="20" stroke="#7F8C8D" stroke-width="0.8"/>
    <line x1="154" y1="38" x2="162" y2="38" stroke="#7F8C8D" stroke-width="0.8"/>
    <text x="166" y="32" font-size="9" fill="#7F8C8D">2 mm</text>
    <text x="18.75" y="51" text-anchor="middle" font-size="9" fill="#2C3E50">2</text>
    <text x="75" y="51" text-anchor="middle" font-size="9" fill="#2C3E50">4</text>
    <text x="131.25" y="51" text-anchor="middle" font-size="9" fill="#2C3E50">2 mm</text>
    <line x1="0" y1="57" x2="150" y2="57" stroke="#7F8C8D" stroke-width="0.8"/>
    <line x1="0" y1="53" x2="0" y2="61" stroke="#7F8C8D" stroke-width="0.8"/>
    <line x1="150" y1="53" x2="150" y2="61" stroke="#7F8C8D" stroke-width="0.8"/>
    <text x="75" y="71" text-anchor="middle" font-size="9" fill="#7F8C8D">总长 8 mm</text>
  </g>
  <text x="490" y="580" text-anchor="middle" font-size="10" fill="#7F8C8D">L5几何架构示意｜不表示CFD、实验或已冻结制造公差</text>
</svg>
