<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="900" viewBox="0 0 1000 900" role="img">
<defs>
  <linearGradient id="cellGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#2980B9"/><stop offset="100%" stop-color="#3498DB"/>
  </linearGradient>
  <linearGradient id="wingGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#95BBD6"/><stop offset="50%" stop-color="#F1C40F"/><stop offset="100%" stop-color="#95BBD6"/>
  </linearGradient>
  <linearGradient id="sunField" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#F7D77B" stop-opacity="0.58"/>
    <stop offset="65%" stop-color="#F7D77B" stop-opacity="0.22"/>
    <stop offset="100%" stop-color="#F7D77B" stop-opacity="0.05"/>
  </linearGradient>
  <marker id="arrowSun" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
    <path d="M0,0 L10,5 L0,10 Z" fill="#F39C12"/>
  </marker>
  <marker id="arrowHot" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
    <path d="M0,0 L9,4.5 L0,9 Z" fill="#D35400"/>
  </marker>
</defs>
<rect width="1000" height="900" fill="white"/>
<text x="48" y="48" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="30" font-weight="bold" fill="#2C3E50" text-anchor="start">硅一体微鳍散热</text>
<text x="952" y="46" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="15" font-weight="400" fill="#7F8C8D" text-anchor="end">结构候选示意，非性能排序</text>
<line x1="48" y1="72" x2="952" y2="72" stroke="#95A5A6" stroke-width="2" stroke-linecap="round"/>
<rect x="48" y="100" width="904" height="438" rx="14" fill="#E8F6F3" fill-opacity="0.55" stroke="#95A5A6" stroke-width="2"/>
<text x="120" y="144" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="22" font-weight="bold" fill="#2C3E50" text-anchor="start">硅一体微鳍</text>
<rect x="265" y="248" width="330" height="30" fill="url(#cellGrad)" stroke="#2C3E50" stroke-width="2"/>
<rect x="295" y="278" width="18" height="160" fill="url(#cellGrad)" stroke="#2C3E50" stroke-width="1.5"/>
<rect x="337" y="278" width="18" height="160" fill="url(#cellGrad)" stroke="#2C3E50" stroke-width="1.5"/>
<rect x="379" y="278" width="18" height="160" fill="url(#cellGrad)" stroke="#2C3E50" stroke-width="1.5"/>
<rect x="421" y="278" width="18" height="160" fill="url(#cellGrad)" stroke="#2C3E50" stroke-width="1.5"/>
<rect x="463" y="278" width="18" height="160" fill="url(#cellGrad)" stroke="#2C3E50" stroke-width="1.5"/>
<rect x="505" y="278" width="18" height="160" fill="url(#cellGrad)" stroke="#2C3E50" stroke-width="1.5"/>
<rect x="547" y="278" width="18" height="160" fill="url(#cellGrad)" stroke="#2C3E50" stroke-width="1.5"/>

<!-- local cooling/heat-transfer markers in the inter-fin channels -->
<g id="localCoolingMarkers" fill="#E8F6F3" stroke="#16A085" stroke-width="2">
  <circle cx="325" cy="358" r="6"/><circle cx="367" cy="358" r="6"/>
  <circle cx="409" cy="358" r="6"/><circle cx="451" cy="358" r="6"/>
  <circle cx="493" cy="358" r="6"/><circle cx="535" cy="358" r="6"/>
</g>
<line x1="340" y1="190" x2="340" y2="242" stroke="#F39C12" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowSun)"/>
<line x1="430" y1="190" x2="430" y2="242" stroke="#F39C12" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowSun)"/>
<line x1="520" y1="190" x2="520" y2="242" stroke="#F39C12" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowSun)"/>
<line x1="599" y1="248" x2="611" y2="248" stroke="#7F8C8D" stroke-width="1.5" stroke-linecap="round"/>
<line x1="599" y1="278" x2="611" y2="278" stroke="#7F8C8D" stroke-width="1.5" stroke-linecap="round"/>
<line x1="605" y1="248" x2="605" y2="278" stroke="#7F8C8D" stroke-width="1.5" stroke-linecap="round"/>
<text x="613" y="267" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="12" font-weight="400" fill="#2C3E50" text-anchor="start">发电层 t=0.3 mm</text>
<line x1="599" y1="278" x2="611" y2="278" stroke="#7F8C8D" stroke-width="1.5" stroke-linecap="round"/>
<line x1="599" y1="438" x2="611" y2="438" stroke="#7F8C8D" stroke-width="1.5" stroke-linecap="round"/>
<line x1="605" y1="278" x2="605" y2="438" stroke="#7F8C8D" stroke-width="1.5" stroke-linecap="round"/>
<text x="613" y="365" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="12" font-weight="400" fill="#2C3E50" text-anchor="start">鳍片层 h=2.7 mm</text>
<text x="70" y="575" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="20" font-weight="bold" fill="#2C3E50" text-anchor="start">图例</text>
<line x1="100" y1="590" x2="100" y2="620" stroke="#F39C12" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowSun)"/>
<text x="125" y="620" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="16" font-weight="400" fill="#F39C12" text-anchor="start">橙色向下箭头：入射阳光方向</text>
<circle cx="520" cy="610" r="7" fill="#E8F6F3" stroke="#16A085" stroke-width="2"/>
<text x="545" y="616" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="16" font-weight="400" fill="#16A085" text-anchor="start">绿色圆环：鳍间局部冷却/换热区域</text>
<rect x="80" y="650" width="42" height="16" fill="url(#cellGrad)" stroke="#2C3E50" stroke-width="1.5"/>
<text x="135" y="665" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="16" font-weight="400" fill="#2C3E50" text-anchor="start">蓝色横板：硅片基底</text>
<rect x="500" y="650" width="12" height="34" fill="url(#cellGrad)" stroke="#2C3E50" stroke-width="1.5"/>
<text x="555" y="675" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="16" font-weight="400" fill="#2C3E50" text-anchor="start">蓝色竖条：一体化微鳍</text>
<rect x="80" y="710" width="18" height="34" fill="white" stroke="#95A5A6" stroke-width="1.5"/>
<text x="125" y="735" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="16" font-weight="400" fill="#2C3E50" text-anchor="start">白色间隙：鳍间硅油流道</text>
<text x="500" y="770" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="15" font-weight="400" fill="#7F8C8D" text-anchor="middle">尺寸标注：发电层厚度 t_gen=0.3 mm；鳍片层高度 h_fin=2.7 mm（候选/未冻结）</text>
<text x="70" y="805" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="15" font-weight="400" fill="#7F8C8D" text-anchor="start">鳍间圆环表示局部冷却/换热区域；鳍效率、压降和制造需分开核验。</text>
<line x1="48" y1="830" x2="952" y2="830" stroke="#95A5A6" stroke-width="1" stroke-linecap="round"/>
<text x="500" y="865" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="15" font-weight="400" fill="#7F8C8D" text-anchor="middle">概念结构示意；流场与性能需进一步验证。</text>
</svg>
