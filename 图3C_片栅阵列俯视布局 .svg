<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" font-family="'Microsoft YaHei','SimHei','Arial',sans-serif">
  <defs>
    <linearGradient id="cellGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2980B9" /><stop offset="100%" stop-color="#3498DB" /></linearGradient>
    <marker id="arrowTeal" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#16A085" /></marker>
    <marker id="arrowLight" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#F39C12" /></marker>
    <marker id="arrowDim" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#7F8C8D" /></marker>
  </defs>
  <rect width="1120" height="620" fill="white" />
  <text x="30" y="30" font-size="20" font-weight="bold" fill="#333">图3C</text>
  <text x="100" y="30" font-size="16" font-weight="bold" fill="#333">片栅阵列俯视布局与错落关系</text>
  <rect x="30" y="60" width="1060" height="460" rx="10" fill="#FBFCFC" stroke="#ECF0F1" stroke-width="1.5" />
  <text x="50" y="90" font-size="12" fill="#2C3E50" font-weight="bold">俯视投影：十个片段连续相接，X向投影无间隙</text>
  <text x="550" y="155" font-size="10" fill="#7F8C8D" text-anchor="middle">俯视图仅表达片段投影与 X–Y 位置关系</text>
  <rect x="100" y="220" width="900" height="72" rx="3" fill="url(#cellGrad)" stroke="#2C3E50" stroke-width="1.2" />
  <g stroke="#2C3E50" stroke-width="1" stroke-dasharray="3,2">
    <line x1="190" y1="220" x2="190" y2="292" /><line x1="280" y1="220" x2="280" y2="292" /><line x1="370" y1="220" x2="370" y2="292" /><line x1="460" y1="220" x2="460" y2="292" /><line x1="550" y1="220" x2="550" y2="292" /><line x1="640" y1="220" x2="640" y2="292" /><line x1="730" y1="220" x2="730" y2="292" /><line x1="820" y1="220" x2="820" y2="292" /><line x1="910" y1="220" x2="910" y2="292" />
  </g>
  <g fill="#2C3E50" font-size="11" font-weight="bold" text-anchor="middle">
    <text x="145" y="263">L1</text><text x="235" y="263">L2</text><text x="325" y="263">L3</text><text x="415" y="263">L4</text><text x="505" y="263">L5</text><text x="595" y="263">L6</text><text x="685" y="263">L7</text><text x="775" y="263">L8</text><text x="865" y="263">L9</text><text x="955" y="263">L10</text>
  </g>
  <g stroke="#7F8C8D" stroke-width="0.8"><line x1="100" y1="204" x2="190" y2="204" /><line x1="100" y1="198" x2="100" y2="210" /><line x1="190" y1="198" x2="190" y2="210" /></g>
  <text x="145" y="194" text-anchor="middle" font-size="10" fill="#7F8C8D">4 mm（投影参考）</text>
  <g stroke="#7F8C8D" stroke-width="0.8"><line x1="80" y1="220" x2="80" y2="292" /><line x1="74" y1="220" x2="86" y2="220" /><line x1="74" y1="292" x2="86" y2="292" /></g>
  <text x="60" y="264" text-anchor="middle" transform="rotate(-90 60 256)" font-size="10" fill="#7F8C8D">2 mm（流向参考）</text>
  
  <text x="550" y="430" text-anchor="middle" font-size="10" fill="#7F8C8D">投影无间隙 ≠ 流道无间隙；散热间隙需在截面和流热模型中单独定义</text>

<text x="60" y="462" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="12" font-weight="bold" fill="#2C3E50">图例</text><rect x="60" y="473" width="30" height="12" rx="2" fill="url(#cellGrad)" stroke="#2C3E50" stroke-width="1" /><text x="102" y="484" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="10" font-weight="400" fill="#34495E">蓝色连续条：L1–L10片段阵列</text><line x1="60" y1="502" x2="100" y2="502" stroke="#2C3E50" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3,2" /><text x="112" y="506" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="10" font-weight="400" fill="#34495E">深蓝虚线：片段边界</text><line x1="415" y1="502" x2="455" y2="502" stroke="#7F8C8D" stroke-width="1" stroke-linecap="round" /><text x="465" y="506" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="10" font-weight="400" fill="#7F8C8D">灰色尺寸线：4 mm与2 mm示意尺寸</text><text x="550" y="342" text-anchor="middle" font-size="10" fill="#7F8C8D">4 mm为单片横向参考尺寸（示意）</text>  <text x="560" y="575" text-anchor="middle" font-size="10" fill="#7F8C8D">示意图：仅表达片段平面几何与相对位置；非性能排序，非 CFD 结果。</text>
</svg>