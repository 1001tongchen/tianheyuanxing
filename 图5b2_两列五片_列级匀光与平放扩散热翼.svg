<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1500" viewBox="0 0 1800 1500" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">两列五片列级匀光与平放扩散热翼</title>
  <desc id="desc">参考平放扩散热翼图的颜色与线条。两套独立聚光器分别输出两条光路，连接上置的左右两个列级长方形匀光器，再分别形成左右两列五片硅片的连续长方形光斑；青绿色箭头表示沿片列2 mm方向的冷却流向。</desc>
  <defs>
    <linearGradient id="wingGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#95BBD6"/><stop offset="50%" stop-color="#F1C40F"/><stop offset="100%" stop-color="#95BBD6"/></linearGradient>
    <linearGradient id="spotGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F39C12" stop-opacity="0.12"/><stop offset="50%" stop-color="#F1C40F" stop-opacity="0.22"/><stop offset="100%" stop-color="#F39C12" stop-opacity="0.12"/></linearGradient>
    <linearGradient id="homGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#FFF4C2"/><stop offset="50%" stop-color="#F1C40F" stop-opacity="0.42"/><stop offset="100%" stop-color="#FFF4C2"/></linearGradient>
    <linearGradient id="outputBeamGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#FFF4B0" stop-opacity="0.35"/><stop offset="100%" stop-color="#FFC83D" stop-opacity="0.90"/></linearGradient>
    <marker id="arrowSun" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#F39C12"/></marker>
    <marker id="arrowBeam" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L16,8 L0,16 Z" fill="#F39C12"/></marker>
    <marker id="arrowCool" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#16A085"/></marker>
    <marker id="arrowHot" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#D35400"/></marker>
  </defs>
  <rect width="1800" height="1500" fill="#FFFFFF"/>
  <text x="70" y="62" font-size="38" font-weight="700" fill="#2C3E50">两列五片：列级匀光与平放扩散热翼</text>
  <text x="1730" y="58" font-size="22" fill="#7F8C8D" text-anchor="end">结构候选示意，非性能排序</text>
  <line x1="70" y1="88" x2="1730" y2="88" stroke="#95A5A6" stroke-width="2" stroke-linecap="round"/>

  <rect x="60" y="115" width="1680" height="1030" rx="16" fill="#E8F6F3" fill-opacity="0.55" stroke="#95A5A6" stroke-width="2"/>
  <circle cx="100" cy="155" r="21" fill="#2C3E50"/><text x="100" y="163" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">B</text>
  <text x="140" y="163" font-size="27" font-weight="700" fill="#2C3E50">每列1个长方形匀光器 → 2个连续长方形光斑 → 每列5片</text>

  <g id="optics">
    <text x="115" y="235" font-size="24" font-weight="700" fill="#2C3E50">1→2列级光斑整形</text>
    <g data-role="primary-concentrator" data-id="1">
      <text x="210" y="330" font-size="22" font-weight="700" fill="#2C3E50" text-anchor="middle">1路聚光器输出主光束</text>
      <polygon data-role="output-beam-envelope" data-id="1" points="70,350 250,370 250,410 70,430" fill="url(#outputBeamGrad)"/>
      <line x1="85" y1="390" x2="245" y2="390" stroke="#F39C12" stroke-width="7" stroke-linecap="round" marker-end="url(#arrowBeam)"/>
    </g>
    <g data-role="primary-concentrator" data-id="2">
      <text x="210" y="520" font-size="22" font-weight="700" fill="#2C3E50" text-anchor="middle">2路聚光器输出主光束</text>
      <polygon data-role="output-beam-envelope" data-id="2" points="70,540 250,560 250,600 70,620" fill="url(#outputBeamGrad)"/>
      <line x1="85" y1="580" x2="245" y2="580" stroke="#F39C12" stroke-width="7" stroke-linecap="round" marker-end="url(#arrowBeam)"/>
    </g>
    <path data-role="column-optical-mapping" data-column="2" d="M270 390 H800 V270 H1250 V390 H1295" fill="none" stroke="#F39C12" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowSun)"/>
    <path data-role="column-optical-mapping" data-column="1" d="M270 580 H800 V450 H975" fill="none" stroke="#F39C12" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowSun)"/>
    <rect x="90" y="650" width="700" height="300" rx="12" fill="#FFFFFF" fill-opacity="0.78" stroke="#95A5A6" stroke-width="2"/>
    <text x="120" y="690" font-size="26" font-weight="700" fill="#2C3E50">天空俯视：无缝2×5阵列</text>
    <line x1="120" y1="710" x2="760" y2="710" stroke="#D9E6E3" stroke-width="1.5"/>
    <text x="120" y="748" font-size="22" font-weight="700" fill="#2C3E50">每片中央有效区：4×2 mm｜每列五片连续受光带：4×10 mm</text>
    <text x="120" y="786" font-size="22" fill="#7F8C8D">中央橙色受光区｜两侧渐变扩散热翼</text>
    <text x="120" y="824" font-size="22" fill="#2C3E50">1路、2路匀光器分别对应左列、右列硅片</text>
    <text x="120" y="862" font-size="22" fill="#2C3E50">1路、2路聚光器分别对应两条独立光路</text>
    <text x="120" y="910" font-size="22" fill="#7F8C8D">列间串扰尚待光线追迹验证；仅表达几何对应关系</text>
  </g>

  <g id="receiver">
    <text x="1220" y="220" font-size="26" font-weight="700" fill="#2C3E50" text-anchor="middle">两列匀光器上置示意</text>
    <text x="1220" y="252" font-size="22" fill="#7F8C8D" text-anchor="middle">分别对应下方左右两列连续光斑</text>
    <g data-role="column-homogenizer" data-column="1"><rect x="975" y="285" width="170" height="220" rx="8" fill="url(#homGrad)" stroke="#2C3E50" stroke-width="3"/><path d="M1000 310 L1120 480 M1120 310 L1000 480" fill="none" stroke="#F39C12" stroke-width="2.5" stroke-linecap="round"/><text x="1060" y="385" font-size="22" font-weight="700" fill="#2C3E50" text-anchor="middle">左列</text><text x="1060" y="418" font-size="22" font-weight="700" fill="#2C3E50" text-anchor="middle">匀光器</text></g>
    <g data-role="column-homogenizer" data-column="2"><rect x="1295" y="285" width="170" height="220" rx="8" fill="url(#homGrad)" stroke="#2C3E50" stroke-width="3"/><path d="M1320 310 L1440 480 M1440 310 L1320 480" fill="none" stroke="#F39C12" stroke-width="2.5" stroke-linecap="round"/><text x="1380" y="385" font-size="22" font-weight="700" fill="#2C3E50" text-anchor="middle">右列</text><text x="1380" y="418" font-size="22" font-weight="700" fill="#2C3E50" text-anchor="middle">匀光器</text></g>
    <path data-role="homogenizer-to-spot" data-column="1" d="M1060 510 V575" fill="none" stroke="#F39C12" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowSun)"/>
    <path data-role="homogenizer-to-spot" data-column="2" d="M1380 510 V575" fill="none" stroke="#F39C12" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowSun)"/>
    <text x="960" y="535" font-size="22" fill="#D35400" text-anchor="end">左列连续光斑</text>
    <text x="1480" y="535" font-size="22" fill="#D35400" text-anchor="start">右列连续光斑</text>
    <!-- row 1 -->
    <g data-role="chip" data-id="1"><rect x="900" y="600" width="320" height="80" fill="url(#wingGrad)" stroke="#2C3E50" stroke-width="2"/><rect data-role="active-region" data-id="1" data-column="1" x="980" y="600" width="160" height="80" fill="#EDBB99"/></g>
    <g data-role="heat-spread-pair" data-id="1"><line x1="975" y1="640" x2="925" y2="640" stroke="#D35400" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowHot)"/><line x1="1145" y1="640" x2="1195" y2="640" stroke="#D35400" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowHot)"/></g>
    <g data-role="chip" data-id="2"><rect x="1220" y="600" width="320" height="80" fill="url(#wingGrad)" stroke="#2C3E50" stroke-width="2"/><rect data-role="active-region" data-id="2" data-column="2" x="1300" y="600" width="160" height="80" fill="#EDBB99"/></g>
    <g data-role="heat-spread-pair" data-id="2"><line x1="1295" y1="640" x2="1245" y2="640" stroke="#D35400" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowHot)"/><line x1="1465" y1="640" x2="1515" y2="640" stroke="#D35400" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowHot)"/></g>
    <!-- row 2 -->
    <g data-role="chip" data-id="3"><rect x="900" y="680" width="320" height="80" fill="url(#wingGrad)" stroke="#2C3E50" stroke-width="2"/><rect data-role="active-region" data-id="3" data-column="1" x="980" y="680" width="160" height="80" fill="#EDBB99"/></g>
    <g data-role="heat-spread-pair" data-id="3"><line x1="975" y1="720" x2="925" y2="720" stroke="#D35400" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowHot)"/><line x1="1145" y1="720" x2="1195" y2="720" stroke="#D35400" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowHot)"/></g>
    <g data-role="chip" data-id="4"><rect x="1220" y="680" width="320" height="80" fill="url(#wingGrad)" stroke="#2C3E50" stroke-width="2"/><rect data-role="active-region" data-id="4" data-column="2" x="1300" y="680" width="160" height="80" fill="#EDBB99"/></g>
    <g data-role="heat-spread-pair" data-id="4"><line x1="1295" y1="720" x2="1245" y2="720" stroke="#D35400" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowHot)"/><line x1="1465" y1="720" x2="1515" y2="720" stroke="#D35400" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowHot)"/></g>
    <!-- row 3 -->
    <g data-role="chip" data-id="5"><rect x="900" y="760" width="320" height="80" fill="url(#wingGrad)" stroke="#2C3E50" stroke-width="2"/><rect data-role="active-region" data-id="5" data-column="1" x="980" y="760" width="160" height="80" fill="#EDBB99"/></g>
    <g data-role="heat-spread-pair" data-id="5"><line x1="975" y1="800" x2="925" y2="800" stroke="#D35400" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowHot)"/><line x1="1145" y1="800" x2="1195" y2="800" stroke="#D35400" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowHot)"/></g>
    <g data-role="chip" data-id="6"><rect x="1220" y="760" width="320" height="80" fill="url(#wingGrad)" stroke="#2C3E50" stroke-width="2"/><rect data-role="active-region" data-id="6" data-column="2" x="1300" y="760" width="160" height="80" fill="#EDBB99"/></g>
    <g data-role="heat-spread-pair" data-id="6"><line x1="1295" y1="800" x2="1245" y2="800" stroke="#D35400" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowHot)"/><line x1="1465" y1="800" x2="1515" y2="800" stroke="#D35400" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowHot)"/></g>
    <!-- row 4 -->
    <g data-role="chip" data-id="7"><rect x="900" y="840" width="320" height="80" fill="url(#wingGrad)" stroke="#2C3E50" stroke-width="2"/><rect data-role="active-region" data-id="7" data-column="1" x="980" y="840" width="160" height="80" fill="#EDBB99"/></g>
    <g data-role="heat-spread-pair" data-id="7"><line x1="975" y1="880" x2="925" y2="880" stroke="#D35400" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowHot)"/><line x1="1145" y1="880" x2="1195" y2="880" stroke="#D35400" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowHot)"/></g>
    <g data-role="chip" data-id="8"><rect x="1220" y="840" width="320" height="80" fill="url(#wingGrad)" stroke="#2C3E50" stroke-width="2"/><rect data-role="active-region" data-id="8" data-column="2" x="1300" y="840" width="160" height="80" fill="#EDBB99"/></g>
    <g data-role="heat-spread-pair" data-id="8"><line x1="1295" y1="880" x2="1245" y2="880" stroke="#D35400" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowHot)"/><line x1="1465" y1="880" x2="1515" y2="880" stroke="#D35400" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowHot)"/></g>
    <!-- row 5 -->
    <g data-role="chip" data-id="9"><rect x="900" y="920" width="320" height="80" fill="url(#wingGrad)" stroke="#2C3E50" stroke-width="2"/><rect data-role="active-region" data-id="9" data-column="1" x="980" y="920" width="160" height="80" fill="#EDBB99"/></g>
    <g data-role="heat-spread-pair" data-id="9"><line x1="975" y1="960" x2="925" y2="960" stroke="#D35400" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowHot)"/><line x1="1145" y1="960" x2="1195" y2="960" stroke="#D35400" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowHot)"/></g>
    <g data-role="chip" data-id="10"><rect x="1220" y="920" width="320" height="80" fill="url(#wingGrad)" stroke="#2C3E50" stroke-width="2"/><rect data-role="active-region" data-id="10" data-column="2" x="1300" y="920" width="160" height="80" fill="#EDBB99"/></g>
    <g data-role="heat-spread-pair" data-id="10"><line x1="1295" y1="960" x2="1245" y2="960" stroke="#D35400" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowHot)"/><line x1="1465" y1="960" x2="1515" y2="960" stroke="#D35400" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowHot)"/></g>
    <rect data-role="column-spot" data-column="1" x="995" y="610" width="130" height="380" rx="6" fill="none" stroke="none"/>
    <rect data-role="column-spot" data-column="2" x="1315" y="610" width="130" height="380" rx="6" fill="none" stroke="none"/>
    <text x="1060" y="800" font-size="22" font-weight="700" fill="#2C3E50" text-anchor="middle">左列连续光斑</text>
    <text x="1380" y="800" font-size="22" font-weight="700" fill="#2C3E50" text-anchor="middle">右列连续光斑</text>
    <g data-role="cooling-direction" data-column="1" data-side="left"><line x1="940" y1="1020" x2="940" y2="1050" stroke="#16A085" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowCool)"/></g>
    <g data-role="cooling-direction" data-column="1" data-side="right"><line x1="1180" y1="1020" x2="1180" y2="1050" stroke="#16A085" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowCool)"/></g>
    <g data-role="cooling-direction" data-column="2" data-side="left"><line x1="1260" y1="1020" x2="1260" y2="1050" stroke="#16A085" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowCool)"/></g>
    <g data-role="cooling-direction" data-column="2" data-side="right"><line x1="1500" y1="1020" x2="1500" y2="1050" stroke="#16A085" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowCool)"/></g>
    <text x="1220" y="1090" font-size="22" font-weight="700" fill="#16A085" text-anchor="middle">沿片列2 mm方向冷却（俯视投影）</text>
  </g>

  <rect x="60" y="1160" width="1680" height="250" rx="12" fill="#F8FBFA" stroke="#D9E6E3" stroke-width="1.5"/>
  <text x="80" y="1190" font-size="24" font-weight="700" fill="#2C3E50">图例</text>
  <line x1="80" y1="1203" x2="1720" y2="1203" stroke="#D9E6E3" stroke-width="1.5"/>
  <!-- row 1: optical source and mapping -->
  <polygon points="90,1219 145,1227 145,1243 90,1251" fill="url(#outputBeamGrad)"/>
  <line x1="95" y1="1235" x2="143" y2="1235" stroke="#F39C12" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowSun)"/>
  <text x="160" y="1243" font-size="22" fill="#F39C12">两路聚光器输出主光束包络</text>
  <line x1="500" y1="1235" x2="550" y2="1235" stroke="#F39C12" stroke-width="4" stroke-linecap="round"/>
  <text x="570" y="1243" font-size="22" fill="#F39C12">独立光路连接（1/2路）</text>
  <rect x="950" y="1221" width="42" height="28" rx="4" fill="url(#homGrad)" stroke="#2C3E50" stroke-width="2"/>
  <path d="M956 1226 L986 1244 M986 1226 L956 1244" fill="none" stroke="#F39C12" stroke-width="1.5"/>
  <text x="1010" y="1243" font-size="22" fill="#2C3E50">长方形列级匀光器</text>
  <line x1="1375" y1="1218" x2="1375" y2="1247" stroke="#F39C12" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowSun)"/>
  <text x="1410" y="1243" font-size="22" fill="#F39C12">匀光器输出至连续光斑</text>
  <!-- row 2: receiver and heat-spreading semantics -->
  <rect x="90" y="1283" width="48" height="22" fill="#EDBB99" stroke="#D35400" stroke-width="1.5"/>
  <text x="160" y="1301" font-size="22" fill="#2C3E50">每片中央受光区（4×2 mm）</text>
  <rect x="500" y="1283" width="48" height="22" fill="url(#wingGrad)" stroke="#2C3E50" stroke-width="1.5"/>
  <text x="570" y="1301" font-size="22" fill="#2C3E50">两侧平放扩散热翼（每侧2 mm）</text>
  <rect x="950" y="1280" width="48" height="28" rx="4" fill="none" stroke="#F39C12" stroke-width="3"/>
  <text x="1010" y="1301" font-size="22" fill="#2C3E50">每列连续长方形光斑（跨5片）</text>
  <line x1="1375" y1="1295" x2="1430" y2="1295" stroke="#D35400" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowHot)"/>
  <text x="1450" y="1303" font-size="22" fill="#D35400">横向扩热</text>
  <!-- row 3: cooling and physical boundary semantics -->
  <line x1="95" y1="1346" x2="95" y2="1374" stroke="#16A085" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowCool)"/>
  <text x="125" y="1368" font-size="22" fill="#16A085">沿片列2 mm方向冷却（俯视投影）</text>
  <line x1="500" y1="1360" x2="550" y2="1360" stroke="#2C3E50" stroke-width="2"/>
  <text x="570" y="1368" font-size="22" fill="#2C3E50">细线：硅片实体分界，不切断光斑</text>
  <text x="1010" y="1368" font-size="22" fill="#7F8C8D">图中箭头仅表示概念方向</text>
  <text x="1375" y="1368" font-size="22" fill="#7F8C8D">不代表性能结果</text>
  <line x1="70" y1="1430" x2="1730" y2="1430" stroke="#95A5A6" stroke-width="1" stroke-linecap="round"/>
  <text x="900" y="1455" font-size="22" fill="#7F8C8D" text-anchor="middle">尺寸关系见左侧说明框；串扰与性能尚待验证。</text>
</svg>
