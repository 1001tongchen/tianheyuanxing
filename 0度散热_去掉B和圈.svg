<text x="70" y="795" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="15" font-weight="400" fill="#7F8C8D" text-anchor="start">透明硅油流道（x–z剖面示意）</text>
<text x="500" y="823" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="14" font-weight="400" fill="#7F8C8D" text-anchor="middle">X轴首尾相接：190→330→470→610；位置序列(1,-1)→(2,-2)→(3,-3)→(4,-4)</text>
<text x="500" y="851" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="14" font-weight="400" fill="#D35400" text-anchor="middle">45°位置基准只表示片间位置关系，不表示硅片自身倾斜45°</text>
<text x="70" y="900" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="17" font-weight="400" fill="#16A085" text-anchor="start">机理：错落布置改变局部前缘，片面冷却流向表示硅油带走热量</text>
<text x="70" y="930" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="17" font-weight="400" fill="#D35400" text-anchor="start">风险/待验证：X向旁路、层间压降、歧管均流与装配间隙</text>
<line x1="48" y1="958" x2="952" y2="958" stroke="#95A5A6" stroke-width="1" stroke-linecap="round"/>
<text x="48" y="990" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="14" font-weight="400" fill="#7F8C8D" text-anchor="start">结构候选示意；不构成性能排序；非比例定型图；非CFD结果。</text>
<text x="952" y="990" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="14" font-weight="400" fill="#7F8C8D" text-anchor="end">证据等级：L5 概念结构</text>
</svg>
